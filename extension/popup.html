<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>字幕メモ</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>字幕メモ</h1>
    <div id="status" class="status">状態を確認中…</div>
  </header>

  <section class="options">
    <label class="options__row">
      <input type="checkbox" id="autoCaptions" />
      会議に入ったら字幕(CC)を自動でオンにする
    </label>
    <p class="options__hint">
      記録できるのは字幕が出ているあいだだけです。オンにし忘れると、気づくのは会議が終わってからになります。
    </p>
  </section>

  <details id="syncSettings" class="sync-settings">
    <summary>review-markdown連携</summary>
    <p class="sync-settings__hint">
      発言を記録するたびに、review-markdownが開いているMarkdownファイルへも書き足します。
      同じ端末でreview-markdownが動いていれば、連携コードは自動で取り込みます
      （立ち上げ直してトークンが変わったときも、そのまま繋ぎ直します）。
      貼り付けが要るのは、自動で見つからないとき——既定と違うポートで動かしているときなど——だけです。
    </p>
    <form id="syncForm">
      <label class="sync-settings__row">
        <input type="checkbox" id="syncAutoPair" />
        review-markdownを自動で見つけて連携する
      </label>
      <label class="sync-settings__row">
        <input type="checkbox" id="syncEnabled" />
        連携を有効にする
      </label>
      <label class="sync-settings__field">
        連携コード
        <input type="text" id="syncCode" placeholder="rmc1...." autocomplete="off" spellcheck="false" />
      </label>
      <p id="syncPairing" class="sync-settings__note"></p>
      <label class="sync-settings__row">
        <input type="checkbox" id="syncAutoPath" />
        会議ごとにファイルを自動で作る
      </label>
      <label class="sync-settings__field" id="syncPathField">
        書き込み先ファイル（レビュー対象ディレクトリからの相対パス）
        <input type="text" id="syncPath" list="syncPathOptions" placeholder="meet-captions/today.md" />
        <datalist id="syncPathOptions"></datalist>
      </label>
      <p id="syncTranscriptFiles" class="sync-settings__note"></p>
      <div class="sync-settings__actions">
        <button type="submit" class="btn">保存</button>
        <button type="button" class="btn" id="syncTest">接続を確認</button>
        <span id="syncSaved" class="sync-settings__saved" hidden>保存しました</span>
      </div>
      <p id="syncStatus" class="sync-settings__status" aria-live="polite"></p>
    </form>
  </details>

  <section id="memoList" class="memo-list">
    <p class="empty">読み込み中…</p>
  </section>

  <template id="memoItemTemplate">
    <article class="memo-item">
      <div class="memo-item__header">
        <div>
          <div class="memo-item__title"></div>
          <div class="memo-item__meta"></div>
        </div>
        <div class="memo-item__actions">
          <button class="btn btn--toggle" type="button">表示</button>
          <button class="btn btn--copy" type="button">コピー</button>
          <button class="btn btn--download" type="button">保存(.md)</button>
          <button class="btn btn--delete" type="button">削除</button>
        </div>
      </div>
      <pre class="memo-item__body" hidden></pre>
    </article>
  </template>

  <script src="pairing.js"></script>
  <script src="popup.js"></script>
</body>
</html>
